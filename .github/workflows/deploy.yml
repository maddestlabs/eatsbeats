name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Guard Pages-Incompatible Web Font Packages
        run: |
          if grep -RInE 'google_fonts|GoogleFonts' pubspec.yaml lib; then
            echo 'google_fonts is blocked for GitHub Pages web builds in this repo. Prefer bundled assets or generic sans-serif/monospace families.'
            exit 1
          fi

      - name: Build Web Production App
        run: flutter build web --release --base-href "/"

      - name: Bundle Documentation into Web Artifact
        run: cp -r docs build/web/docs

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
