name: "🎛️ GUI Tweak / Preset Update"
description: "Submit a visual layout tweak or preset update for bundled instruments or FX"
title: "[GUI Tweak] "
labels: ["gui-patch"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing a GUI tweak to Eatsbeats! Submissions with valid Eatscript payloads are automatically converted into Pull Requests by our bot.
  - type: input
    id: preset_id
    attributes:
      label: Preset ID
      description: "The identifier of the preset (e.g. `kick_channel_strip`, `moog_synth_bass`)"
      placeholder: "kick_channel_strip"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of Changes
      description: "Briefly explain what you changed (e.g. knob styling, spacing, color accents)"
      placeholder: "Swapped drive knob to vintage Bakelite and adjusted row layout..."
    validations:
      required: false
  - type: textarea
    id: payload
    attributes:
      label: Eatscript / GUI Code Payload
      description: "The complete updated Eatscript code generated by Eatsbeats"
      render: python
    validations:
      required: true
